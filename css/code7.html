<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        nav{
            display: flex;
            justify-content: space-around;
            background-color: rgb(8, 8, 27);
            color: white;
            padding: 20px;
            align-items: center;
            border-radius: 30px;
            margin: 10px;
        }
        .logo{
            font-size: large;
            font-weight: bold;
            color: yellow;
        }
        .logo span{
            color: white;
        }

        ul{
            display: flex;
            gap: 20px;
            list-style-type: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">G.<span>D</span> </div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Project</li>
            <li>Services</li>

        </ul>
    </nav>
</body>
</html>
