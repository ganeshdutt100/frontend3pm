<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

          .mainBox{
            width: 500px;
            height: 500px;
            background-color: lightcoral;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .num{
            background-color: white;
            border-radius: 50%;
            height: 40px;
            width: 40px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            border: 2px solid black;
            /* border-right-color: white;
            border-top-color: white;
            border-bottom-color: white; */


            
            
        }
        .num1{
            top: 20%;
            left: 80px;
        }
        .num2{
            left: 70px;
            top: 35%;
        }.num3{
            right: 85px;
            top: 50%;
        }.num4{
            left: 70px;
            top: 60%;

        }.num5{
            bottom: 0;
            left: 0;
        }.num6{
            bottom: 0;
        }
        .box{
            width: 300px;
            height: 300px;
            background-color: lightblue;
            border-radius: 20px;
        }
        img{
            width: 100%;
            height: 100px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="mainBox">
        <p class=" num num1">1</p>
        <p class=" num num2">2</p>
        <p class=" num num3">3</p>
        <p class=" num num4">4</p>
        <p class=" num num5">5</p>
        <p class=" num num6">6</p>

    <div class="box">
        <img src="../img/image2.png" alt="">
        <h1>Lorem, ipsum dolor.</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam, nemo?</p>
        <button>Click me </button>
    </div>

    </div>
</body>
